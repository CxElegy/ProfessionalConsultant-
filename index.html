<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Card</title>
  <meta name="description" content="1日1枚。例を読み、課題を自分で解いて、解答例と比べる。コンサルタントの基礎トレーニング。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="wrap top">
    <div class="brand"><span class="brand-mark">札</span><span>Daily Card</span></div>
    <p class="date" id="date"></p>
  </header>

  <main class="wrap">
    <section class="stats" id="stats" aria-label="記録"></section>

    <section aria-labelledby="today-h">
      <h1 id="today-h" class="section-title">今日のカード</h1>
      <div id="today"></div>
    </section>

    <section aria-labelledby="deck-h" class="deck-section">
      <div class="deck-head">
        <h2 id="deck-h" class="section-title">わたしのカード</h2>
        <span class="muted small" id="deck-count"></span>
      </div>
      <div class="dots" id="dots" aria-label="過去28日の記録"></div>
      <div id="deck" class="deck"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p class="small muted">「△ もう一度」を選んだカードは3日後に復習として出題されます。全問を解いた後は、過去のカードが復習として順に出てきます。記録はこのブラウザ内にのみ保存されます。</p>
    <p class="small"><button class="link-btn" id="export">記録を書き出す</button></p>
  </footer>

  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
